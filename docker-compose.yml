services:
  db:
    image: postgres:16
    container_name: continuo-db
    environment:
      POSTGRES_USER: continuo
      POSTGRES_PASSWORD: continuo
      POSTGRES_DB: continuo
    ports:
      # Host 5433 → container 5432 (host 5432 is taken by a local system Postgres).
      - "5433:5432"
    volumes:
      - continuo_pgdata:/var/lib/postgresql/data
      # Applied only on first init of an empty data volume; the ingest script
      # also runs this file each run, so the schema is guaranteed either way.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuo -d continuo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  continuo_pgdata:
